<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BINGO Maps Layout</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #EEF0F2; /* Cor de fundo cinza claro */
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Impede rolagem para simular app */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container Principal (Simulando a tela do celular/app) */
        .app-container {
            width: 100%;
            height: 100%;
            max-width: 1200px; /* Limite para telas grandes */
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* --- Header / Logo --- */
        .header {
            padding: 20px 30px;
            z-index: 10;
            position: absolute;
            top: 0;
            left: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2rem;
            color: #000;
        }

        .logo-icon {
            /* Simulando o ícone do logo */
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #FF6B00 50%, #2A5CAA 50%);
            border-radius: 50% 50% 0 50%;
            transform: rotate(45deg);
        }

        .logo-text {
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        
        .logo-text span {
            font-weight: 400;
        }

        /* --- Área Principal (Background Branco Curvo + Imagem) --- */
        .main-content {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-end; /* Empurra conteúdo para direita */
        }

        /* A forma branca arredondada no fundo */
        .white-shape {
            position: absolute;
            top: 15%;
            right: 0;
            width: 55%; /* Ocupa pouco mais da metade da tela */
            height: 70%;
            background-color: #FFFFFF;
            border-top-left-radius: 80px;
            border-bottom-left-radius: 80px;
            z-index: 1;
            box-shadow: -10px 0 30px rgba(0,0,0,0.02);
        }

        /* A imagem do PIN */
        .pin-image {
            position: relative;
            z-index: 2;
            width: 500px; /* Tamanho ajustável */
            max-width: 90%;
            margin-right: -50px; /* Leve deslocamento para direita para cortar igual ao design */
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.2));
            transform: translateY(-20px);
        }

        /* --- Texto Grande (Título) --- */
        .hero-text {
            position: absolute;
            bottom: 140px; /* Espaço para o menu inferior */
            left: 30px;
            z-index: 5;
        }

        .hero-text h1 {
            font-family: 'Oswald', sans-serif; /* Fonte condensada e grossa */
            font-size: clamp(3rem, 8vw, 6rem); /* Responsivo */
            font-weight: 600;
            line-height: 0.9;
            color: #000;
            text-transform: uppercase;
        }

        /* --- Menu Inferior Flutuante --- */
        .bottom-nav-container {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        .bottom-nav {
            background-color: #FFFFFF;
            padding: 10px 10px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .btn {
            border: none;
            background: none;
            padding: 12px 24px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.2s ease;
        }

        .btn-ghost {
            color: #000;
            font-weight: 600;
        }

        .btn-text-only {
            color: #000;
            font-weight: 700;
        }

        /* Layout específico do menu conforme a imagem */
        .nav-content {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 15px;
            align-items: center;
        }
        
        .nav-left {
            font-weight: 600;
            color: #000;
        }
        
        .nav-right {
            font-weight: 700;
            color: #000;
        }

        /* Ajustes para telas menores (Mobile vertical) */
        @media (max-width: 768px) {
            .white-shape {
                width: 85%; /* Aumenta a área branca no mobile */
                top: 10%;
                height: 60%;
            }

            .pin-image {
                width: 120%; /* Imagem maior no mobile */
                margin-right: -20%;
                transform: translateY(-50px);
            }

            .hero-text {
                bottom: 120px;
            }
        }
    </style>
</head>
<body>

    <main class="app-container">
        
        <header class="header">
            <div class="logo">
                <div class="logo-icon"></div>
                <div class="logo-text">BINGO<span>maps</span></div>
            </div>
        </header>

        <section class="main-content">
            <div class="white-shape"></div>
            
            <img src="https://i.postimg.cc/C1byS8tC/1769203954545.png" alt="Mapa arqueológico 3D em formato de pin" class="pin-image">
        </section>

        <div class="hero-text">
            <h1>O Futuro da<br>Escavação</h1>
        </div>

        <div class="bottom-nav-container">
            <div class="bottom-nav">
                <div class="nav-content">
                    <span class="nav-left">O que é?</span>
                    <span class="nav-right">Usar o BINGO</span>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
