<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BINGO Maps Layout Full Screen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* ===== VIDEO BACKGROUND ===== */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -10;
            overflow: hidden;
        }

        .video-bg iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120vw;
            height: 120vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* Overlay pra melhorar leitura */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(238, 240, 242, 0.75);
            z-index: -5;
        }

        /* ===== APP ===== */
        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #FF6B00 50%, #2A5CAA 50%);
            border-radius: 50% 50% 0 50%;
            transform: rotate(45deg);
        }

        .logo-text {
            font-size: 3rem;
            font-weight: 800;
            color: #000;
        }

        .logo-text span {
            font-weight: 400;
        }

        .white-background-shape {
            position: absolute;
            top: 29%;
            right: -15%;
            width: 65%;
            height: 40%;
            background-color: #FFFFFF;
            border-radius: 110px;
            z-index: 1;
        }

        .pin-image {
            position: absolute;
            top: 50%;
            right: -20%;
            transform: translateY(-55%);
            width: 70%;
            max-width: 1600px;
            z-index: 2;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15));
            pointer-events: none;
        }

        .content-area {
            position: absolute;
            bottom: 5%;
            left: 9%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .hero-title {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(3rem, 10vw, 6rem);
            line-height: 0.95;
            text-transform: uppercase;
            max-width: 70%;
        }

        .bottom-menu {
            background-color: #FFFFFF;
            padding: 12px 25px;
            border-radius: 50px;
            display: flex;
            justify-content: space-between;
            width: 80%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .menu-item-left,
        .menu-item-right {
            font-size: 2rem;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .white-background-shape {
                width: 80%;
                height: 75%;
            }

            .pin-image {
                width: 110%;
                right: -30%;
            }

            .hero-title {
                max-width: 80%;
            }

            .bottom-menu {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- VIDEO BACKGROUND -->
    <div class="video-bg">
        <iframe 
            src="https://www.youtube.com/embed/YzMlG4YC2Hk?autoplay=1&mute=1&loop=1&playlist=YzMlG4YC2Hk&controls=0&showinfo=0&modestbranding=1"
            frameborder="0"
            allow="autoplay; fullscreen">
        </iframe>
    </div>
    <div class="video-overlay"></div>

    <main class="app-container">

        <header class="header">
            <div class="logo-icon"></div>
            <div class="logo-text">BINGO<span>maps</span></div>
        </header>

        <div class="white-background-shape"></div>
        <img src="https://i.postimg.cc/QdP4ntCD/1000252093.png" class="pin-image">

        <div class="content-area">
            <h1 class="hero-title">O FUTURO DA<br>ESCAVAÇÃO</h1>

            <div class="bottom-menu">
                <span class="menu-item-left">O que é?</span>
                <span class="menu-item-right">Usar o BINGO</span>
            </div>
        </div>

    </main>

</body>
</html>
