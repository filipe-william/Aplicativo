<!DOCTYPE html>    
<html lang="pt-br">    
<head>    
    <meta charset="UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">    
    <title>BINGO Maps</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#EEF0F2">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">    
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">    
    
    <style>    
        /* ========================================================
           RESET GERAL
           ======================================================== */
        * {    
            margin: 0;    
            padding: 0;    
            box-sizing: border-box;    
            -webkit-tap-highlight-color: transparent; 
        }   

        a {
            text-decoration: none;
            color: inherit;
        } 
    
        html, body {    
            height: 100%;    
            width: 100%;    
            overflow: hidden; 
            font-family: 'Inter', sans-serif;    
            background-color: #EEF0F2; 
        }    

        .desktop-view { display: none; }
        .mobile-view { display: none; }
        #splash-screen { display: none; } 

        /* ========================================================
           LAYOUT MOBILE / TABLET (até 1024px)
           ======================================================== */
        @media (max-width: 1024px) {
            
            /* --- SPLASH SCREEN --- */
            #splash-screen {
                display: flex;
                position: fixed;
                inset: 0; 
                background: linear-gradient(180deg, #F9FAFB 0%, #E5E7EB 100%);
                z-index: 9999; 
                justify-content: center;
                align-items: center;
                animation: fadeOutSplash 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 2.2s;
            }

            .splash-content {
                display: flex;
                align-items: center;
                gap: 12px;
                transform: scale(1.3); 
            }

            .logo-icon-splash {
                width: 32px;
                height: 32px;
                background: linear-gradient(135deg, #FF6B00 50%, #2A5CAA 50%);
                box-shadow: 0 8px 20px rgba(0,0,0,0.15);
                transform-origin: center;
                animation: buildIconSplash 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards 0.2s;
                opacity: 0;
            }

            .logo-text-splash {
                font-size: 2rem;
                font-weight: 800;
                color: #111827;
                letter-spacing: -0.5px;
                clip-path: inset(0 100% 0 0);
                animation: swipeTextRevealSplash 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.9s;
            }
            .logo-text-splash span { font-weight: 400; color: #6B7280; }


            /* --- TELA INICIAL --- */
            .mobile-view {
                display: flex;
                flex-direction: column;
                height: 100%;
                width: 100%;
                position: relative;
                background: linear-gradient(180deg, #F9FAFB 0%, #E5E7EB 100%);
            }

            .mobile-header {
                padding: 20px 24px;
                display: flex;
                align-items: center;
                gap: 8px;
                z-index: 10;
                animation: slideDownHeader 0.8s cubic-bezier(0.16, 1, 0.3, 1) both 2.3s;
            }

            .logo-icon-mobile {
                width: 28px;
                height: 28px;
                background: linear-gradient(135deg, #FF6B00 50%, #2A5CAA 50%);
                border-radius: 50% 50% 0 50%;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            }

            .logo-text-mobile {
                font-size: 1.5rem;
                font-weight: 800;
                color: #111827;
                letter-spacing: -0.5px;
            }
            .logo-text-mobile span { font-weight: 400; color: #6B7280;}


            /* --- ÁREA DO PIN 3D --- */
            .mobile-hero {
                flex-grow: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
                z-index: 5;
                transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.5s;
            }

            .mobile-hero.shrunk {
                transform: scale(0.85) translateY(-30px);
                opacity: 0.6;
            }

            .pin-entrance-wrapper {
                width: 75%;
                max-width: 350px;
                animation: popInSpring 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) both 2.5s; 
            }

            .mobile-pin {
                width: 100%;
                height: auto;
                filter: drop-shadow(0 20px 30px rgba(0,0,0,0.15));
                animation: float 4s ease-in-out infinite;
                transform-origin: center bottom;
            }

            /* --- BOTTOM SHEET (ABA INFERIOR) --- */
            .sheet-entrance-wrapper {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                z-index: 20;
                animation: slideUpWrapper 0.8s cubic-bezier(0.16, 1, 0.3, 1) both 2.6s;
            }

            .mobile-bottom-sheet {
                background: rgba(255, 255, 255, 0.80);
                backdrop-filter: blur(25px); 
                -webkit-backdrop-filter: blur(25px);
                border-radius: 32px 32px 0 0;
                padding: 24px 24px 40px 24px;
                box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.08);
                display: flex;
                flex-direction: column;
                
                /* Agora esconde 260px para acomodar os 3 botões */
                transform: translateY(260px); 
                transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1);
            }

            .mobile-bottom-sheet.expanded {
                transform: translateY(0);
            }

            .peek-area {
                display: flex;
                flex-direction: column;
                align-items: center;
                cursor: pointer; 
            }

            .drag-indicator {
                width: 40px;
                height: 5px;
                background-color: rgba(0, 0, 0, 0.15);
                border-radius: 10px;
                margin-bottom: 20px;
            }

            .mobile-title {
                font-family: 'Oswald', sans-serif;
                font-size: 2.8rem;
                font-weight: 700;
                line-height: 1.1;
                color: #000;
                text-transform: uppercase;
                text-align: left;
                width: 100%;
                animation: fadeSlideUpElement 0.8s cubic-bezier(0.16, 1, 0.3, 1) both 2.8s;
            }

            .swipe-hint {
                font-size: 0.8rem;
                color: #6B7280;
                text-transform: uppercase;
                letter-spacing: 1px;
                font-weight: 600;
                margin-top: 10px;
                margin-bottom: 24px; 
                opacity: 0;
                animation: fadeInHint 1s ease forwards 3.3s; 
            }

            /* Botões */
            .mobile-actions {
                display: flex;
                flex-direction: column;
                gap: 12px;
                width: 100%;
            }

            .btn-primary {
                background: #000;
                color: #FFF;
                font-weight: 600;
                font-size: 1.1rem;
                padding: 18px;
                border-radius: 18px;
                text-align: center;
                transition: transform 0.2s, background 0.2s;
                box-shadow: 0 8px 20px rgba(0,0,0,0.15);
                animation: fadeSlideUpElement 0.8s cubic-bezier(0.16, 1, 0.3, 1) both 2.9s;
            }
            .btn-primary:active { transform: scale(0.96); background: #333; }

            .btn-secondary {
                background: rgba(0, 0, 0, 0.05);
                color: #000;
                font-weight: 600;
                font-size: 1.1rem;
                padding: 18px;
                border-radius: 18px;
                text-align: center;
                transition: transform 0.2s, background 0.2s;
            }
            .btn-secondary:active { transform: scale(0.96); background: rgba(0, 0, 0, 0.1); }
            
            /* Delays em cascata para os botões secundários */
            .btn-secondary:nth-child(2) { animation: fadeSlideUpElement 0.8s cubic-bezier(0.16, 1, 0.3, 1) both 3.0s; }
            .btn-secondary:nth-child(3) { animation: fadeSlideUpElement 0.8s cubic-bezier(0.16, 1, 0.3, 1) both 3.1s; }

            /* ========================================================
               KEYFRAMES (MOBILE)
               ======================================================== */
            @keyframes buildIconSplash {
                0% { transform: scale(0) rotate(-90deg); border-radius: 50%; opacity: 0; }
                60% { transform: scale(1.2) rotate(60deg); border-radius: 50%; opacity: 1; }
                80% { transform: scale(1) rotate(45deg); border-radius: 50%; opacity: 1;}
                100% { transform: scale(1) rotate(45deg); border-radius: 50% 50% 0 50%; opacity: 1;}
            }
            @keyframes swipeTextRevealSplash {
                0% { clip-path: inset(0 100% 0 0); transform: translateX(-15px); }
                100% { clip-path: inset(0 0 0 0); transform: translateX(0); }
            }
            @keyframes fadeOutSplash { to { opacity: 0; visibility: hidden; } }
            @keyframes slideDownHeader {
                from { opacity: 0; transform: translateY(-20px); }
                to { opacity: 1; transform: translateY(0); }
            }
            @keyframes popInSpring {
                0% { opacity: 0; transform: scale(0.5) translateY(40px); }
                60% { opacity: 1; transform: scale(1.05) translateY(-10px); }
                100% { opacity: 1; transform: scale(1) translateY(0); }
            }
            @keyframes slideUpWrapper {
                from { transform: translateY(100%); }
                to { transform: translateY(0); }
            }
            @keyframes fadeSlideUpElement {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
            @keyframes fadeInHint {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            @keyframes float {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-15px); }
            }
        }

        /* ========================================================
           LAYOUT DESKTOP (Com agrupamento de links à esquerda)
           ======================================================== */
        @media (min-width: 1025px) {
            .desktop-view {
                display: flex; position: relative; width: 100%; height: 100%; flex-direction: column; 
            }
            .desktop-header {    
                position: absolute; top: 30px; left: 40px; z-index: 20; display: flex; align-items: center; gap: 12px;    
            }    
            .logo-icon {    
                width: 32px; height: 32px; background: linear-gradient(135deg, #FF6B00 50%, #2A5CAA 50%); border-radius: 50% 50% 0 50%; transform: rotate(45deg);    
            }    
            .logo-text { font-size: 2.5rem; font-weight: 800; color: #000; letter-spacing: -0.5px; }    
            .logo-text span { font-weight: 400; }    
            .white-background-shape {    
                position: absolute; top: 29%; right: -15%; width: 65%; height: 40%; background-color: #FFFFFF; border-radius: 110px; z-index: 1; box-shadow: -10px 10px 40px rgba(0,0,0,0.02);
            }    
            .pin-image {    
                position: absolute; top: 50%; right: -20%; transform: translateY(-55%); width: 70%; max-width: 1200px; height: auto; z-index: 2; filter: drop-shadow(0 25px 35px rgba(0,0,0,0.2)); pointer-events: none; 
            }    
            .content-area {    
                position: absolute; bottom: 8%; left: 9%; width: calc(100% - 40px); z-index: 10; display: flex; flex-direction: column; gap: 40px;    
            }    
            .hero-title {    
                font-family: 'Oswald', sans-serif; font-size: clamp(4rem, 9vw, 8rem); font-weight: 600; line-height: 0.95; color: #000; text-transform: uppercase; white-space: pre-wrap; max-width: 60%; 
            }    
            
            .bottom-menu {    
                background-color: #FFFFFF; padding: 16px 35px; border-radius: 50px; display: flex; justify-content: space-between; align-items: center; width: 60%; max-width: 850px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: transform 0.3s ease, box-shadow 0.3s ease;
            }
            .bottom-menu:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0,0,0,0.08); }    
            
            /* Novo grupo para os links secundários à esquerda */
            .menu-links-left {
                display: flex;
                gap: 25px; /* Espaço entre "O que é?" e "Interprete os dados" */
                align-items: center;
            }

            .menu-item-left { font-weight: 600; color: #555; font-size: 1.3rem; cursor: pointer; transition: color 0.3s; }
            .menu-item-left:hover { color: #000; }
            
            .menu-item-right { font-weight: 700; color: #000; font-size: 1.4rem; display: flex; align-items: center; gap: 10px; }    
            .menu-item-right::after { content: '→'; transition: transform 0.3s ease; }
            .menu-item-right:hover::after { transform: translateX(5px); }
        }
    </style>    
</head>    
<body>    
    
    <!-- ==========================================
         SPLASH SCREEN
         ========================================== -->
    <div id="splash-screen">
        <div class="splash-content">
            <div class="logo-icon-splash"></div>
            <div class="logo-text-splash">BINGO<span>maps</span></div>
        </div>
    </div>

    <!-- ==========================================
         VISÃO MOBILE E TABLET
         ========================================== -->
    <main class="mobile-view">
        <header class="mobile-header">
            <div class="logo-icon-mobile"></div>    
            <div class="logo-text-mobile">BINGO<span>maps</span></div>
        </header>

        <div class="mobile-hero" id="mobileHero">
            <div class="pin-entrance-wrapper">
                <img src="https://i.postimg.cc/QdP4ntCD/1000252093.png" alt="Pin de localização 3D" class="mobile-pin">
            </div>
        </div>

        <div class="sheet-entrance-wrapper">
            <div class="mobile-bottom-sheet" id="bottomSheet">
                <!-- Área visível da aba -->
                <div class="peek-area" id="peekArea">
                    <div class="drag-indicator"></div>
                    <h1 class="mobile-title">O FUTURO DA<br>ESCAVAÇÃO</h1>
                    <div class="swipe-hint" id="swipeHint">Arraste para ver mais</div>
                </div>
                
                <!-- Botões escondidos -->
                <div class="mobile-actions">
                    <a href="BINGOHeatMap.html" class="btn-primary">Usar o BINGO</a>
                    <a href="interpretarDados.html" class="btn-secondary">Interprete os dados</a>
                    <a href="#" class="btn-secondary">O que é?</a>
                </div>
            </div>
        </div>
    </main>

    <!-- ==========================================
         VISÃO DESKTOP
         ========================================== -->
    <main class="desktop-view app-container">    
        <header class="desktop-header">    
            <div class="logo-icon"></div>    
            <div class="logo-text">BINGO<span>maps</span></div>    
        </header>    
        <div class="white-background-shape"></div>    
        <img src="https://i.postimg.cc/QdP4ntCD/1000252093.png" alt="Pin de localização 3D" class="pin-image">    
        <div class="content-area">    
            <h1 class="hero-title">O FUTURO DA<br>ESCAVAÇÃO</h1>    
            <div class="bottom-menu">    
                <!-- Agrupamento dos links secundários -->
                <div class="menu-links-left">
                    <a href="#" class="menu-item-left">O que é?</a>  
                    <a href="interpretarDados.html" class="menu-item-left">Interprete os dados</a>
                </div>  
                <a href="BINGOHeatMap.html" class="menu-item-right">Usar o BINGO</a>    
            </div>    
        </div>    
    </main>    
    
    <script>
        // Força o recarregamento da página se o usuário voltar pelo botão do navegador (bfcache)
        window.addEventListener('pageshow', (event) => {
            if (event.persisted) {
                window.location.reload();
            }
        });

        // --- Registro do Service Worker ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .catch(err => console.error('Erro no SW', err));
            });
        }

        // Remove a Splash Screen após 3 segundos
        setTimeout(() => {
            const splashScreen = document.getElementById('splash-screen');
            if (splashScreen) splashScreen.remove();
        }, 3000);

        // --- Lógica Interativa da Aba Inferior (Mobile) ---
        const sheet = document.getElementById('bottomSheet');
        const peekArea = document.getElementById('peekArea');
        const swipeHint = document.getElementById('swipeHint');
        const mobileHero = document.getElementById('mobileHero');
        let isExpanded = false;
        let isReady = false; 

        // Libera interações depois de 3.5 segundos
        setTimeout(() => { isReady = true; }, 3500);

        // Função para alternar o estado da aba
        function toggleSheet(forceState) {
            if (!isReady) return;
            
            isExpanded = forceState !== undefined ? forceState : !isExpanded;
            
            sheet.classList.toggle('expanded', isExpanded);
            mobileHero.classList.toggle('shrunk', isExpanded);
            
            swipeHint.textContent = isExpanded ? 'Arraste para baixo para fechar' : 'Arraste para ver mais';
        }

        // Eventos de clique e swipe
        peekArea.addEventListener('click', () => toggleSheet());

        let startY = 0;
        sheet.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        }, { passive: true });

        sheet.addEventListener('touchend', (e) => {
            if (!isReady) return;
            const endY = e.changedTouches[0].clientY;
            const diffY = startY - endY;

            if (diffY > 30 && !isExpanded) {
                toggleSheet(true); 
            } else if (diffY < -30 && isExpanded) {
                toggleSheet(false); 
            }
        }, { passive: true });

    </script>
</body>    
</html>
