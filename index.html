<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BingoApp - Heatmap Por Zonas</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* Container dos controles */
        #controls {
            position: absolute; bottom: 30px; left: 50%; 
            transform: translateX(-50%); z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center; width: 85%; max-width: 400px;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }

        .btn-row { display: flex; gap: 10px; width: 100%; justify-content: center; }

        button {
            border: none; padding: 12px 20px; border-radius: 12px; 
            font-size: 16px; font-weight: bold; cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:active { transform: scale(0.98); }

        #btnConnect { background: #007bff; color: white; flex-grow: 1; }
        #btnCenter { background: #f0f0f0; color: #333; font-size: 20px; padding: 10px 15px; }

        /* Painel Manual */
        .manual-panel {
            display: flex; gap: 8px; width: 100%; margin-top: 5px;
            padding-top: 10px; border-top: 1px solid #eee;
        }
        #manualInput {
            flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #ccc;
            font-size: 16px; text-align: center;
        }
        #btnAddManual { background: #28a745; color: white; }

        #status { color: #666; font-size: 0.9em; }
        #valor-sensor { font-size: 20px; font-weight: bold; }
        
        /* Legenda simples */
        .legenda { font-size: 12px; display: flex; gap: 10px; justify-content: center; width: 100%; margin-top: 5px;}
        .dot { height: 10px; width: 10px; display: inline-block; border-radius: 50%; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="controls">
        <div class="btn-row">
            <button id="btnConnect">📡 Conectar ESP32</button>
            <button id="btnCenter" title="Centralizar em mim">🎯</button>
        </div>
        
        <div style="display: flex; justify-content: space-between; width: 100%; padding: 0 10px; box-sizing: border-box;">
            <span id="status">Desconectado</span>
            <span id="valor-sensor">--</span>
        </div>
        
        <div class="legenda">
            <span><span class="dot" style="background:blue;"></span> 0-200</span>
            <span><span class="dot" style="background:#ffd700;"></span> 200-800</span>
            <span><span class="dot" style="background:red;"></span> >800</span>
        </div>

        <div class="manual-panel">
            <input type="number" id="manualInput" placeholder="Valor (ex: 150, 500, 900)" value="150">
            <button id="btnAddManual">➕ Testar</button>
        </div>
    </div>

     <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        // 1. INICIA O MAPA
        const map = L.map('map').setView([-23.5505, -46.6333], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // --- MUDANÇA PRINCIPAL: UMA ÚNICA CAMADA DE CALOR ---
        // Todos os pontos vão para esta lista
        let allPoints = [];

        // Criamos uma única camada que sabe ir do Azul ao Vermelho
        let mainLayer = L.heatLayer(allPoints, {
            radius: 35, 
            blur: 20, 
            maxZoom: 17,
            // O gradiente define a cor baseada na "força" acumulada naquele ponto
            gradient: {
                0.2: 'blue',   // Baixa intensidade
                0.4: 'cyan',   // Transição
                0.6: 'yellow', // Média intensidade
                0.8: 'orange', // Alta
                1.0: 'red'     // Altíssima
            }
        }).addTo(map);

        // Variáveis globais
        let currentLat = 0;
        let currentLng = 0;
        let bluetoothDevice;
        let userCircle = null;

        // 2. NOVA LÓGICA DE CORES (INTEGRAÇÃO)
        function processarValor(valorRaw) {
            document.getElementById('valor-sensor').innerText = valorRaw;
            let valor = parseFloat(valorRaw);

            if (currentLat === 0 || currentLng === 0) {
                console.log("Aguardando GPS para plotar: " + valor);
                return;
            }

            // --- LÓGICA DE NORMALIZAÇÃO ---
            // O Heatmap funciona melhor com intensidades entre 0.0 e 1.0
            // Vamos assumir que seu sensor vai de 0 a 1000 (ajuste o 1000 se o máximo for maior)
            let maxSensorValue = 1000; 
            
            // Calcula a intensidade proporcional (ex: valor 500 vira 0.5)
            // O Math.min garante que não passe de 1.0 se vier um valor maluco
            let intensidade = Math.min(valor / maxSensorValue, 1.0);
            
            // Se o valor for muito baixo (ruído), forçamos um mínimo visual para aparecer azul
            if(intensidade < 0.2 && intensidade > 0) intensidade = 0.2;

            // Adiciona o ponto na lista única
            // O Leaflet.heat vai somar essa intensidade com o que já estiver lá
            allPoints.push([currentLat, currentLng, intensidade]);
            
            // Atualiza a camada
            mainLayer.setLatLngs(allPoints);
            
            console.log(`Ponto adicionado: Lat ${currentLat}, Lng ${currentLng}, Int ${intensidade}`);
        }

        // 3. BOTÃO DE TESTE MANUAL
        document.getElementById('btnAddManual').addEventListener('click', () => {
            const val = document.getElementById('manualInput').value;
            if(val === "") return;
            processarValor(val);
        });

        // 4. GPS
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(position => {
                currentLat = position.coords.latitude;
                currentLng = position.coords.longitude;
                
                if (userCircle) {
                    userCircle.setLatLng([currentLat, currentLng]);
                } else {
                    userCircle = L.circle([currentLat, currentLng], {
                        radius: 8, color: 'white', weight: 2,
                        fillColor: '#2196F3', fillOpacity: 1
                    }).addTo(map);
                    map.setView([currentLat, currentLng], 17);
                }
            }, error => console.error(error), { enableHighAccuracy: true });
        }

        // 5. CENTER E BLUETOOTH
        document.getElementById('btnCenter').addEventListener('click', () => {
            if(currentLat !== 0) map.setView([currentLat, currentLng], 18);
        });

        document.getElementById('btnConnect').addEventListener('click', async () => {
            try {
                document.getElementById('status').innerText = "Procurando...";
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32_Heatmap' }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(CHAR_UUID);
                document.getElementById('status').innerText = "🟢 Conectado!";
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', (event) => {
                    const value = new TextDecoder().decode(event.target.value);
                    processarValor(value);
                });
                bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                     document.getElementById('status').innerText = "🔴 Desconectado";
                });
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "Erro";
            }
        });
    </script>

</body>
</html>
