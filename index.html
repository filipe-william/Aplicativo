<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BingoApp</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        /* Botão flutuante bonito */
        #controls {
            position: absolute; bottom: 30px; left: 50%; 
            transform: translateX(-50%); z-index: 1000;
            background: white; padding: 15px; border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center; width: 80%;
        }
        button {
            background: #007bff; color: white; border: none;
            padding: 12px 24px; border-radius: 20px; font-size: 16px;
            font-weight: bold; cursor: pointer;
        }
        #status { display: block; margin-top: 10px; color: #666; font-size: 0.9em; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="controls">
        <button id="btnConnect">📡 Conectar ESP32</button>
        <span id="status">Desconectado</span>
        <div id="valor-sensor" style="font-size: 20px; font-weight: bold; margin-top:5px;">--</div>
    </div>

    <script>
        // CONFIGURAÇÃO: Os mesmos UUIDs do código C++
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        // 1. INICIA O MAPA
        const map = L.map('map').setView([-23.5505, -46.6333], 15); // Começa em SP (vai mudar com GPS)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Camada de Calor (Heatmap)
        // Formato dos pontos: [latitude, longitude, intensidade(0.0 a 1.0)]
        let heatPoints = [];
        let heatLayer = L.heatLayer(heatPoints, {radius: 35, blur: 20, maxZoom: 17}).addTo(map);

        // Variáveis globais
        let currentLat = 0;
        let currentLng = 0;
        let bluetoothDevice;

        // 2. PEGAR GPS DO CELULAR EM TEMPO REAL
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(position => {
                currentLat = position.coords.latitude;
                currentLng = position.coords.longitude;
                
                // Opcional: Centralizar o mapa onde você está
                // map.setView([currentLat, currentLng]); 
                
                // Desenha um circulo azul onde você está agora
                L.circle([currentLat, currentLng], {radius: 5}).addTo(map);
            }, error => {
                console.error("Erro GPS:", error);
                alert("Ative o GPS!");
            }, { enableHighAccuracy: true });
        }

        // 3. CONEXÃO BLUETOOTH
        document.getElementById('btnConnect').addEventListener('click', async () => {
            try {
                document.getElementById('status').innerText = "Procurando...";
                
                // Pede permissão para parear
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ESP32_Heatmap' }],
                    optionalServices: [SERVICE_UUID]
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                const characteristic = await service.getCharacteristic(CHAR_UUID);

                document.getElementById('status').innerText = "🟢 Conectado!";
                
                // Inicia leitura contínua (Notificações)
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleData);

                bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                     document.getElementById('status').innerText = "🔴 Desconectado";
                });

            } catch (error) {
                console.error(error);
                alert("Erro ao conectar: " + error);
                document.getElementById('status').innerText = "Erro";
            }
        });

        // 4. QUANDO O ESP32 MANDA UM DADO
        function handleData(event) {
            const value = new TextDecoder().decode(event.target.value);
            document.getElementById('valor-sensor').innerText = "Sinal: " + value;

            // Transforma o valor (0 a 100) em intensidade (0.0 a 1.0)
            let intensidade = parseFloat(value) / 100;

            if (currentLat !== 0 && currentLng !== 0) {
                // ADICIONA O PONTO NO MAPA DE CALOR
                heatPoints.push([currentLat, currentLng, intensidade]);
                heatLayer.setLatLngs(heatPoints);
                console.log(`Ponto adicionado: ${currentLat}, ${currentLng}, Int: ${intensidade}`);
            }
        }
    </script>
</body>
</html>
