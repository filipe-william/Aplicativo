<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BingoApp - Heatmap Por Zonas</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <style>
        :root {
            --panel-alpha: 0.95;
        }

        body { margin: 0; padding: 0; font-family: sans-serif; transition: background-color 0.3s; overflow: hidden; }
        #map { height: 100vh; width: 100%; background: #e0e0e0; /* Cor de fundo caso desliguem o mapa base */ }
        
        #controls {
            position: absolute; bottom: 30px; left: 50%; 
            transform: translateX(-50%); z-index: 1000;
            background: rgba(255, 255, 255, var(--panel-alpha));
            padding: 15px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center; width: 85%; max-width: 400px;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            transition: background 0.3s;
        }

        .btn-row { display: flex; gap: 10px; width: 100%; justify-content: center; }

        button {
            border: none; padding: 12px 20px; border-radius: 12px; 
            font-size: 16px; font-weight: bold; cursor: pointer;
            transition: transform 0.1s, background 0.2s, color 0.2s;
        }
        button:active { transform: scale(0.98); }

        #btnConnect { background: #007bff; color: white; flex-grow: 1; }
        #btnCenter { background: #f0f0f0; color: #333; font-size: 20px; padding: 10px 15px; }
        #btnShutdown { background: #dc3545; color: white; width: 100%; margin-top: 5px; font-size: 14px; }

        .manual-panel {
            display: flex; gap: 8px; width: 100%; margin-top: 5px;
            padding-top: 10px; border-top: 1px solid #eee;
            transition: border-color 0.3s;
        }
        #manualInput {
            flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #ccc;
            font-size: 16px; text-align: center;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }
        #btnAddManual { background: #28a745; color: white; }

        #status { color: #666; font-size: 0.9em; transition: color 0.3s; }
        #valor-sensor { font-size: 20px; font-weight: bold; }
        
        .legenda { font-size: 12px; display: flex; gap: 10px; justify-content: center; width: 100%; margin-top: 5px;}
        .dot { height: 10px; width: 10px; display: inline-block; border-radius: 50%; }

        /* ====== CONFIGURAÇÕES ====== */
        /* Ajuste do botão de config para não sobrepor o controle de camadas nativo do Leaflet (que fica na direita) */
        #btnSettings {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: white; color: #333; border-radius: 50%; width: 45px; height: 45px;
            font-size: 22px; padding: 0; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #settingsModal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 2000; background: white; padding: 20px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); width: 80%; max-width: 300px;
            display: flex; flex-direction: column; gap: 15px;
            transition: all 0.3s ease;
        }
        #settingsModal.hidden {
            opacity: 0; pointer-events: none; transform: translate(-50%, -40%);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;}
        .modal-header h3 { margin: 0; font-size: 18px; color: #333;}
        #btnCloseSettings { background: transparent; color: #666; padding: 5px; font-size: 18px; box-shadow: none; }
        
        .setting-item { display: flex; flex-direction: column; gap: 8px; text-align: left;}
        .setting-item label { font-weight: bold; font-size: 14px; color: #444;}
        .setting-item input[type="range"] { width: 100%; }
        
        .checkbox-row { display: flex; align-items: center; gap: 10px; }
        .checkbox-row input { transform: scale(1.3); cursor: pointer; }

        /* ====== MODO ESCURO ====== */
        body.dark-mode #controls, 
        body.dark-mode #settingsModal, 
        body.dark-mode #btnSettings {
            background: rgba(30, 30, 30, var(--panel-alpha)); 
            color: #eee;
        }
        body.dark-mode #map { background: #222; }
        body.dark-mode #btnSettings { color: #eee; }
        body.dark-mode .modal-header h3, 
        body.dark-mode .setting-item label { color: #eee; }
        body.dark-mode #btnCloseSettings { color: #aaa; }
        body.dark-mode #status { color: #aaa; }
        body.dark-mode .manual-panel { border-top-color: #444; }
        body.dark-mode #manualInput { background: #444; color: white; border-color: #555; }
        body.dark-mode #btnCenter { background: #444; color: white; }

        /* Deixa o controle nativo do Leaflet escuro também */
        body.dark-mode .leaflet-control-layers {
            background: rgba(30, 30, 30, 0.9);
            color: #eee;
            border-color: #444;
        }

        body.dark-mode .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <button id="btnSettings" title="Configurações">⚙️</button>

    <div id="settingsModal" class="hidden">
        <div class="modal-header">
            <h3>Configurações</h3>
            <button id="btnCloseSettings">✖</button>
        </div>
        
        <div class="setting-item">
            <div class="checkbox-row">
                <input type="checkbox" id="darkModeToggle">
                <label for="darkModeToggle" style="margin:0;">Modo Escuro</label>
            </div>
        </div>

        <div class="setting-item">
            <label for="opacitySlider">Opacidade do Painel</label>
            <input type="range" id="opacitySlider" min="0.2" max="1" step="0.05" value="0.95">
        </div>
    </div>

    <div id="controls">
        <div class="btn-row">
            <button id="btnConnect">📡 Conectar ESP32</button>
            <button id="btnCenter" title="Centralizar em mim">🎯</button>
        </div>
        
        <div style="display: flex; justify-content: space-between; width: 100%; padding: 0 10px; box-sizing: border-box;">
            <span id="status">Desconectado</span>
            <span id="valor-sensor">--</span>
        </div>
        
        <div class="legenda">
            <span><span class="dot" style="background:blue;"></span> 0-200</span>
            <span><span class="dot" style="background:#ffd700;"></span> 200-800</span>
            <span><span class="dot" style="background:red;"></span> >800</span>
        </div>

        <div class="manual-panel">
            <input type="number" id="manualInput" placeholder="Valor" value="150">
            <button id="btnAddManual">➕ Testar</button>
        </div>

        <button id="btnShutdown">⚠️ DESLIGAR BINGO</button>
    </div>

<script>
    // --- Configurações BLE ---
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    // --- Inicialização do Mapa ---
    const map = L.map('map', { zoomControl: false }).setView([-23.5505, -46.6333], 15);
    
    // --- MAPAS BASE (Backgrounds) ---
    const mapaPadrao = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
    // Uma camada "vazia" caso o usuário queira esconder as ruas
    const semMapa = L.layerGroup(); 
    
    // Adiciona o mapa padrão por definição
    mapaPadrao.addTo(map);

    // --- CAMADAS DE DADOS (Overlays) ---
    
    // 1. Heatmap (Agrupamos as 3 cores em um único grupo para facilitar ligar/desligar)
    let ptsBlue = [], ptsYellow = [], ptsRed = [];
    let layerBlue = L.heatLayer(ptsBlue, { radius: 15, blur: 10, gradient: {0.2: 'cyan', 0.65: '#007bff', 1.0: 'navy'} });
    let layerYellow = L.heatLayer(ptsYellow, { radius: 15, blur: 10, gradient: {0.2: '#ffeb3b', 0.65: '#ffc107', 1.0: '#ff9800'} });
    let layerRed = L.heatLayer(ptsRed, { radius: 15, blur: 10, gradient: {0.2: '#ff5252', 0.65: 'red', 1.0: '#8b0000'} });
    
    const heatmapGroup = L.layerGroup([layerBlue, layerYellow, layerRed]).addTo(map);

    // 2. Caminho/Rastro
    let userPathCoords = []; 
    let userPathLine = L.polyline([], { color: '#8e44ad', weight: 4, opacity: 0.8, lineJoin: 'round' });
    const rastroGroup = L.layerGroup([userPathLine]).addTo(map);

    // 3. Localização do Usuário (Bolinha Azul)
    let userCircle = null;
    const locationGroup = L.layerGroup().addTo(map);


    // --- CONTROLE DE CAMADAS (O Menu Superior Direito) ---
    const baseMaps = {
        "Mapa Padrão": mapaPadrao,
        "Sem Mapa (Fundo Limpo)": semMapa
    };

    const overlayMaps = {
        "Dados (Heatmap)": heatmapGroup,
        "Caminho (Rastro)": rastroGroup,
        "Minha Localização": locationGroup
    };

    // Adiciona o controle ao mapa
    L.control.layers(baseMaps, overlayMaps, { position: 'topright' }).addTo(map);
    // Reposicionamos o zoom para baixo da engrenagem para não bagunçar
    L.control.zoom({ position: 'bottomleft' }).addTo(map);


    let currentLat = 0, currentLng = 0, bluetoothDevice = null, characteristic = null, isConnecting = false;
    let lastPointTime = 0;
    const POINT_INTERVAL = 400; 
    let pontosRegistrados = []; 
    const RAIO_MINIMO_METROS = 5;

    // ====== LÓGICA DE CONFIGURAÇÕES (Engrenagem) ======
    const btnSettings = document.getElementById('btnSettings');
    const settingsModal = document.getElementById('settingsModal');
    const btnCloseSettings = document.getElementById('btnCloseSettings');
    const darkModeToggle = document.getElementById('darkModeToggle');
    const opacitySlider = document.getElementById('opacitySlider');

    btnSettings.addEventListener('click', () => settingsModal.classList.remove('hidden'));
    btnCloseSettings.addEventListener('click', () => settingsModal.classList.add('hidden'));

    darkModeToggle.addEventListener('change', (e) => {
        if (e.target.checked) document.body.classList.add('dark-mode');
        else document.body.classList.remove('dark-mode');
    });

    opacitySlider.addEventListener('input', (e) => {
        document.documentElement.style.setProperty('--panel-alpha', e.target.value);
    });
    // =====================================

    function atualizarStatus(msg) { document.getElementById('status').innerText = msg; }

    function processarValor(valorRaw) {
        if (!valorRaw) return;
        let valor = parseFloat(valorRaw);
        if (isNaN(valor)) return;
        document.getElementById('valor-sensor').innerText = valor;
        if (currentLat === 0 || currentLng === 0) return;

        const now = Date.now();
        if (now - lastPointTime < POINT_INTERVAL) return;
        lastPointTime = now;

        const novoPontoLatLng = L.latLng(currentLat, currentLng);
        const localJaMapeado = pontosRegistrados.some(pontoSalvo => novoPontoLatLng.distanceTo(pontoSalvo) < RAIO_MINIMO_METROS);

        if (localJaMapeado) return;
        pontosRegistrados.push(novoPontoLatLng);

        let intensidade = 0.6;
        if (valor < 200) { ptsBlue.push([currentLat, currentLng, intensidade]); layerBlue.setLatLngs(ptsBlue); }
        else if (valor <= 800) { ptsYellow.push([currentLat, currentLng, intensidade]); layerYellow.setLatLngs(ptsYellow); }
        else { ptsRed.push([currentLat, currentLng, intensidade]); layerRed.setLatLngs(ptsRed); }
    }

    document.getElementById('btnAddManual').addEventListener('click', () => {
        processarValor(document.getElementById('manualInput').value);
    });

    // --- CAPTURA DE LOCALIZAÇÃO ---
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(position => {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
            const newLatLng = L.latLng(currentLat, currentLng);

            // Atualiza a bolinha azul (localização atual) DENTRO do locationGroup
            if (userCircle) {
                userCircle.setLatLng(newLatLng);
            } else {
                userCircle = L.circle(newLatLng, { radius: 8, color: 'white', weight: 2, fillColor: '#2196F3', fillOpacity: 1 });
                locationGroup.addLayer(userCircle); // Adiciona ao grupo controlável
                map.setView(newLatLng, 17);
            }

            // Atualiza o rastro
            if (userPathCoords.length === 0) {
                userPathCoords.push(newLatLng);
                userPathLine.addLatLng(newLatLng);
            } else {
                const lastLatLng = userPathCoords[userPathCoords.length - 1];
                if (newLatLng.distanceTo(lastLatLng) > 2) {
                    userPathCoords.push(newLatLng);
                    userPathLine.addLatLng(newLatLng);
                }
            }

        }, null, { enableHighAccuracy: true });
    }

    document.getElementById('btnCenter').addEventListener('click', () => { if (currentLat !== 0) map.setView([currentLat, currentLng], 18); });

    async function connectBLE() {
        if (isConnecting) return;
        isConnecting = true;
        try {
            atualizarStatus("Procurando...");
            bluetoothDevice = await navigator.bluetooth.requestDevice({ filters: [{ name: 'ESP32_Heatmap' }], optionalServices: [SERVICE_UUID] });
            bluetoothDevice.addEventListener('gattserverdisconnected', handleDisconnect);
            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            characteristic = await service.getCharacteristic(CHAR_UUID);
            await characteristic.startNotifications();
            characteristic.addEventListener('characteristicvaluechanged', (e) => {
                const value = new TextDecoder().decode(e.target.value);
                processarValor(value.trim());
            });
            atualizarStatus("🟢 Conectado");
        } catch (error) { atualizarStatus("Erro na conexão"); }
        finally { isConnecting = false; }
    }

    function handleDisconnect() {
        atualizarStatus("🔴 Desconectado");
        setTimeout(() => { if (bluetoothDevice) connectBLE(); }, 2000);
    }

    document.getElementById('btnShutdown').addEventListener('click', async () => {
        if (!characteristic) { alert("Conecte ao ESP32 primeiro!"); return; }
        if (confirm("Deseja desligar o Bingo? (Será necessário apertar Reset no aparelho para ligar de novo)")) {
            const encoder = new TextEncoder();
            await characteristic.writeValue(encoder.encode("SHUTDOWN"));
            atualizarStatus("⚠️ Comando Desligar Enviado");
        }
    });

    document.getElementById('btnConnect').addEventListener('click', connectBLE);
</script>
</body>
</html>
