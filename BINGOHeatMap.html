<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BingoApp - Heatmap Único por Ponto</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        #controls {
            position: absolute; bottom: 30px; left: 50%; 
            transform: translateX(-50%); z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px; border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center; width: 85%; max-width: 400px;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }

        .btn-row { display: flex; gap: 10px; width: 100%; justify-content: center; }

        button {
            border: none; padding: 12px 20px; border-radius: 12px; 
            font-size: 16px; font-weight: bold; cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:active { transform: scale(0.98); }

        #btnConnect { background: #007bff; color: white; flex-grow: 1; }
        #btnCenter { background: #f0f0f0; color: #333; font-size: 20px; padding: 10px 15px; }

        .manual-panel {
            display: flex; gap: 8px; width: 100%; margin-top: 5px;
            padding-top: 10px; border-top: 1px solid #eee;
        }
        #manualInput {
            flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #ccc;
            font-size: 16px; text-align: center;
        }
        #btnAddManual { background: #28a745; color: white; }

        #status { color: #666; font-size: 0.9em; }
        #valor-sensor { font-size: 20px; font-weight: bold; }
        
        .legenda { font-size: 12px; display: flex; gap: 10px; justify-content: center; width: 100%; margin-top: 5px;}
        .dot { height: 10px; width: 10px; display: inline-block; border-radius: 50%; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="controls">
        <div class="btn-row">
            <button id="btnConnect">📡 Conectar ESP32</button>
            <button id="btnCenter" title="Centralizar em mim">🎯</button>
        </div>
        
        <div style="display: flex; justify-content: space-between; width: 100%; padding: 0 10px; box-sizing: border-box;">
            <span id="status">Desconectado</span>
            <span id="valor-sensor">--</span>
        </div>
        
        <div class="legenda">
            <span><span class="dot" style="background:blue;"></span> 0-200</span>
            <span><span class="dot" style="background:#ffd700;"></span> 200-800</span>
            <span><span class="dot" style="background:red;"></span> >800</span>
        </div>

        <div class="manual-panel">
            <input type="number" id="manualInput" placeholder="Valor" value="150">
            <button id="btnAddManual">➕ Testar</button>
        </div>
    </div>

<script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    // 1. INICIA O MAPA
    const map = L.map('map').setView([-23.5505, -46.6333], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    // 2. CONFIGURAÇÃO DAS CAMADAS
    let ptsBlue = [], ptsYellow = [], ptsRed = [];
    
    const layerBlue = L.heatLayer([], {
        radius: 18, blur: 15, maxZoom: 17,
        gradient: {0.4: 'cyan', 0.7: '#007bff', 1.0: 'navy'}
    }).addTo(map);

    const layerYellow = L.heatLayer([], {
        radius: 18, blur: 15, maxZoom: 17,
        gradient: {0.4: '#ffeb3b', 0.7: '#ffc107', 1.0: '#ff9800'}
    }).addTo(map);

    const layerRed = L.heatLayer([], {
        radius: 18, blur: 15, maxZoom: 17,
        gradient: {0.4: '#ff5252', 0.7: 'red', 1.0: '#8b0000'}
    }).addTo(map);

    // 3. VARIÁVEIS DE ESTADO
    let currentLat = 0, currentLng = 0;
    let bluetoothDevice = null, characteristic = null, isConnecting = false;
    let userCircle = null;
    let lastPointTime = 0;
    const POINT_INTERVAL = 400;

    // DICIONÁRIO PARA GARANTIR VALOR ÚNICO POR COORDENADA
    const heatmapData = new Map();

    function atualizarStatus(msg) {
        document.getElementById('status').innerText = msg;
    }

    // 4. PROCESSAMENTO E ATUALIZAÇÃO DO MAPA
    function processarValor(valorRaw) {
        if (!valorRaw || currentLat === 0 || currentLng === 0) return;

        let valor = parseFloat(valorRaw);
        if (isNaN(valor)) return;

        document.getElementById('valor-sensor').innerText = valor;

        const now = Date.now();
        if (now - lastPointTime < POINT_INTERVAL) return;
        lastPointTime = now;

        // Criar chave única (5 casas decimais = precisão de ~1.1m)
        const key = `${currentLat.toFixed(5)},${currentLng.toFixed(5)}`;

        // Salva ou sobrescreve o valor nesta coordenada
        heatmapData.set(key, { lat: currentLat, lng: currentLng, val: valor });

        redesenharHeatmap();
    }

    function redesenharHeatmap() {
        // Limpa os arrays temporários
        ptsBlue = []; ptsYellow = []; ptsRed = [];

        // Distribui os dados únicos para as camadas corretas
        heatmapData.forEach(ponto => {
            const latlng = [ponto.lat, ponto.lng, 0.8]; // 0.8 de intensidade fixa
            
            if (ponto.val >= 0 && ponto.val < 200) {
                ptsBlue.push(latlng);
            } else if (ponto.val >= 200 && ponto.val <= 800) {
                ptsYellow.push(latlng);
            } else if (ponto.val > 800) {
                ptsRed.push(latlng);
            }
        });

        // Atualiza visualmente o mapa
        layerBlue.setLatLngs(ptsBlue);
        layerYellow.setLatLngs(ptsYellow);
        layerRed.setLatLngs(ptsRed);
    }

    // 5. EVENTOS E GPS
    document.getElementById('btnAddManual').addEventListener('click', () => {
        const val = document.getElementById('manualInput').value;
        if (val !== "") processarValor(val);
    });

    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(position => {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;

            if (userCircle) {
                userCircle.setLatLng([currentLat, currentLng]);
            } else {
                userCircle = L.circle([currentLat, currentLng], {
                    radius: 7, color: 'white', weight: 2, fillColor: '#2196F3', fillOpacity: 1
                }).addTo(map);
                map.setView([currentLat, currentLng], 17);
            }
        }, err => console.error(err), { enableHighAccuracy: true });
    }

    document.getElementById('btnCenter').addEventListener('click', () => {
        if (currentLat !== 0) map.setView([currentLat, currentLng], 18);
    });

    // 6. BLUETOOTH
    async function connectBLE() {
        if (isConnecting) return;
        isConnecting = true;
        try {
            atualizarStatus("Procurando...");
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ name: 'ESP32_Heatmap' }],
                optionalServices: [SERVICE_UUID]
            });
            bluetoothDevice.addEventListener('gattserverdisconnected', handleDisconnect);
            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            characteristic = await service.getCharacteristic(CHAR_UUID);
            await characteristic.startNotifications();
            characteristic.addEventListener('characteristicvaluechanged', (e) => {
                const val = new TextDecoder().decode(e.target.value);
                processarValor(val.trim());
            });
            atualizarStatus("🟢 Conectado");
        } catch (error) {
            console.error(error);
            atualizarStatus("Erro na conexão");
        } finally {
            isConnecting = false;
        }
    }

    function handleDisconnect() {
        atualizarStatus("🔴 Desconectado");
        setTimeout(() => { if (bluetoothDevice) connectBLE(); }, 2000);
    }

    document.getElementById('btnConnect').addEventListener('click', connectBLE);

</script>
</body>
</html>
