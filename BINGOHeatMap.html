    <!-- Ícones Lucide para um visual limpo -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --panel-alpha: 0.75; /* Mais transparente para o efeito Glassmorphism */
            --bg-light: rgba(255, 255, 255, var(--panel-alpha));
            --bg-dark: rgba(28, 28, 30, var(--panel-alpha));
            --text-light: #1c1c1e;
            --text-dark: #f2f2f7;
            --accent: #007aff;
            --danger: #ff3b30;
            --success: #34c759;
            --border-radius: 24px;
        }

        /* Reset e Fontes Nativas (iOS style) */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            overflow: hidden; background: #e5e5ea; color: var(--text-light);
            transition: color 0.4s ease;
        }

        #map { height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Efeito Glassmorphism base */
        .glass-panel {
            background: var(--bg-light);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        /* === HEADER (Status Superior) === */
        #header-status {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; padding: 8px 20px; border-radius: 30px;
            display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500;
        }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ffcc00; transition: background 0.3s;}

        /* === BOTÕES FLUTUANTES SUPERIORES === */
        .float-btn {
            position: absolute; z-index: 1000;
            width: 44px; height: 44px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            border: none; cursor: pointer; color: var(--text-light);
        }
        .float-btn:active { transform: scale(0.92); }
        
        #btnSettings { top: 20px; left: 20px; }
        /* O controle nativo do Leaflet fica na direita, ajustamos depois via CSS do Leaflet */

        /* === PAINEL INFERIOR (Controles Principais) === */
        #bottom-panel {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: 92%; max-width: 400px;
            border-radius: var(--border-radius); padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
        }

        /* Display de Valor */
        .value-display {
            text-align: center; display: flex; flex-direction: column; align-items: center;

        /* Ações Principais */
        .primary-actions { display: flex; gap: 12px; }

            flex: 1; border: none; padding: 14px; border-radius: 16px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            transition: all 0.2s; color: white;

        .btn-action:active { transform: scale(0.96); }
        
        #btnConnect { background: var(--accent); }
        #btnCenter { background: rgba(0,0,0,0.05); color: var(--text-light); flex: 0 0 54px; padding: 0; }
        
        /* Legenda Minimalista */
        .legenda { 
            display: flex; justify-content: space-between; font-size: 11px; font-weight: 500;
            padding: 10px 15px; background: rgba(0,0,0,0.03); border-radius: 12px;

        .legenda-item { display: flex; align-items: center; gap: 6px; }
        .dot { height: 8px; width: 8px; border-radius: 50%; }

        /* === PAINEL DE CONFIGURAÇÕES (BottomSheet) === */
        #settingsSheet {
            position: absolute; bottom: 0; left: 0; width: 100%; z-index: 2000;
            border-radius: 30px 30px 0 0; padding: 25px 20px 40px;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #settingsSheet.active { transform: translateY(0); }
        
        .sheet-handle {
            width: 40px; height: 5px; background: rgba(0,0,0,0.2);
            border-radius: 10px; margin: 0 auto 20px;
        }

        .setting-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .setting-row:last-child { border-bottom: none; }
        
        .setting-info { display: flex; flex-direction: column; gap: 4px; }
        .setting-title { font-size: 16px; font-weight: 500; }
        .setting-desc { font-size: 12px; opacity: 0.6; }

        /* Toggle Switch Nativo iOS Style */
        .toggle-switch {
            position: relative; width: 50px; height: 30px; appearance: none;
            background: #e5e5ea; border-radius: 30px; outline: none; cursor: pointer;
            transition: background 0.3s;
        }
        .toggle-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 26px; height: 26px; background: white; border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .toggle-switch:checked { background: var(--success); }
        .toggle-switch:checked::after { transform: translateX(20px); }

        /* Sliders iOS Style */
        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 6px; background: rgba(0,0,0,0.1);
            border-radius: 5px; outline: none; margin-top: 10px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
            background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.3); cursor: pointer;
        }

        #btnShutdown {
            width: 100%; background: rgba(255, 59, 48, 0.1); color: var(--danger);
            border: none; padding: 15px; border-radius: 16px; font-weight: 600; font-size: 16px;
            margin-top: 20px; cursor: pointer; display: flex; justify-content: center; gap: 8px;
        }

        /* Overlay do Menu (fundo escurecido) */
        #backdrop {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 1500; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #backdrop.active { opacity: 1; pointer-events: auto; }

        /* === MODO ESCURO === */
        body.dark-mode { background: #000; color: var(--text-dark); }
        body.dark-mode .glass-panel { background: var(--bg-dark); border-color: rgba(255,255,255,0.05); }
        body.dark-mode .float-btn { color: var(--text-dark); }
        body.dark-mode #btnCenter { background: rgba(255,255,255,0.1); color: var(--text-dark); }
        body.dark-mode .sheet-handle { background: rgba(255,255,255,0.2); }
        body.dark-mode .setting-row { border-bottom-color: rgba(255,255,255,0.05); }
        body.dark-mode .legenda { background: rgba(255,255,255,0.05); }
        body.dark-mode input[type="range"] { background: rgba(255,255,255,0.1); }
        
        /* Ajuste Leaflet Controls para Dark Mode e Estética iOS */
        .leaflet-control-layers { border-radius: 14px !important; border: none !important; box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important; font-family: inherit !important;}
        body.dark-mode .leaflet-control-layers { background: rgba(28, 28, 30, 0.9) !important; color: #eee !important; }
        body.dark-mode .leaflet-tile-pane { filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Backdrop para o menu -->
    <div id="backdrop"></div>

    <!-- Header Status -->
    <div id="header-status" class="glass-panel">
        <div id="status-indicator" class="status-dot"></div>
        <span id="status-text">Procurando ESP32...</span>
    </div>

    <!-- Botão Configurações -->
    <button id="btnSettings" class="glass-panel float-btn">
        <i data-lucide="settings"></i>
    </button>

    <!-- Bottom Sheet Configurações -->
    <div id="settingsSheet" class="glass-panel">
        <div class="sheet-handle" id="closeSheet"></div>
        
        <div class="setting-row">
            <div class="setting-info">
                <span class="setting-title">Modo Escuro</span>
                <span class="setting-desc">Inverte as cores do mapa e interface</span>
            </div>
            <input type="checkbox" class="toggle-switch" id="darkModeToggle">
        </div>

        <div class="setting-row" style="flex-direction: column; align-items: flex-start; gap: 5px;">
            <div class="setting-info" style="width: 100%;">
                <span class="setting-title">Transparência da Interface</span>
            </div>
            <input type="range" id="opacitySlider" min="0.3" max="1" step="0.05" value="0.75">
        </div>

        <div class="setting-row">
            <div class="setting-info">
                <span class="setting-title">Painel de Testes</span>
                <span class="setting-desc">Simular dados sem hardware</span>
            </div>
            <input type="checkbox" class="toggle-switch" id="testPanelToggle">
        </div>
        
        <!-- Painel Manual Oculto por padrão -->
        <div id="manualTestArea" style="display: none; margin-top: 15px; gap: 10px;">
            <input type="number" id="manualInput" placeholder="Valor (ex: 300)" style="flex:1; padding:12px; border-radius:12px; border:none; background:rgba(0,0,0,0.05); font-size:16px;">
            <button id="btnAddManual" style="padding:12px 20px; border-radius:12px; border:none; background:var(--success); color:white; font-weight:bold;">Testar</button>
        </div>

        <button id="btnShutdown">
            <i data-lucide="power"></i> Desligar Bingo
        </button>
    </div>

    <!-- Painel Inferior Principal -->
    <div id="bottom-panel" class="glass-panel">
        
        <div class="value-display">
            <span class="value-label">Intensidade do Sinal</span>
            <span id="valor-sensor">--</span>
        </div>

        <div class="primary-actions">
            <button id="btnConnect" class="btn-action">
                <i data-lucide="bluetooth"></i> Conectar
            </button>
            <button id="btnCenter" class="btn-action" title="Centralizar Mapa">
                <i data-lucide="navigation"></i>
            </button>
        </div>
        
        <div class="legenda">
            <div class="legenda-item"><span class="dot" style="background:#007aff;"></span> 0-200</div>
            <div class="legenda-item"><span class="dot" style="background:#ffcc00;"></span> 200-800</div>
            <div class="legenda-item"><span class="dot" style="background:#ff3b30;"></span> >800</div>
        </div>
    </div>

<script>
    // Inicializa ícones Lucide
    lucide.createIcons();

    // --- Configurações BLE ---
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

    // --- Inicialização do Mapa ---
    const map = L.map('map', { zoomControl: false }).setView([-23.5505, -46.6333], 15);
    
    const mapaPadrao = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
    const semMapa = L.layerGroup(); 
    mapaPadrao.addTo(map);

    // --- CAMADAS DE DADOS ---
    let ptsBlue = [], ptsYellow = [], ptsRed = [];
    let layerBlue = L.heatLayer(ptsBlue, { radius: 15, blur: 10, gradient: {0.2: 'cyan', 0.65: '#007aff', 1.0: 'navy'} });
    let layerYellow = L.heatLayer(ptsYellow, { radius: 15, blur: 10, gradient: {0.2: '#ffcc00', 0.65: '#ff9500', 1.0: '#ff3b30'} }); // Cores iOS
    let layerRed = L.heatLayer(ptsRed, { radius: 15, blur: 10, gradient: {0.2: '#ff3b30', 0.65: '#c51162', 1.0: '#8b0000'} });
    
    const heatmapGroup = L.layerGroup([layerBlue, layerYellow, layerRed]).addTo(map);

    let userPathCoords = []; 
    let userPathLine = L.polyline([], { color: '#af52de', weight: 5, opacity: 0.8, lineJoin: 'round' }); // Roxo iOS
    const rastroGroup = L.layerGroup([userPathLine]).addTo(map);

    let userCircle = null;
    const locationGroup = L.layerGroup().addTo(map);

    // --- CONTROLE DE CAMADAS ---
    const baseMaps = { "Mapa (Ruas)": mapaPadrao, "Fundo Limpo": semMapa };
    const overlayMaps = { "Dados (Calor)": heatmapGroup, "Rastro": rastroGroup, "Localização": locationGroup };
    L.control.layers(baseMaps, overlayMaps, { position: 'topright' }).addTo(map);

    // Variáveis de Estado
    let currentLat = 0, currentLng = 0, bluetoothDevice = null, characteristic = null, isConnecting = false;
    let lastPointTime = 0;
    const POINT_INTERVAL = 400; 
    let pontosRegistrados = []; 
    const RAIO_MINIMO_METROS = 5;

    // ====== UI LOGIC (Menus e Botões) ======
    const btnSettings = document.getElementById('btnSettings');
    const settingsSheet = document.getElementById('settingsSheet');
    const backdrop = document.getElementById('backdrop');
    const closeSheet = document.getElementById('closeSheet');
    
    function toggleSheet() {
        settingsSheet.classList.toggle('active');
        backdrop.classList.toggle('active');
    }
    
    btnSettings.addEventListener('click', toggleSheet);
    backdrop.addEventListener('click', toggleSheet);
    closeSheet.addEventListener('click', toggleSheet); // Puxar barra fecha

    // Configurações
    document.getElementById('darkModeToggle').addEventListener('change', (e) => {
        document.body.classList.toggle('dark-mode', e.target.checked);
    });

    document.getElementById('opacitySlider').addEventListener('input', (e) => {
        document.documentElement.style.setProperty('--panel-alpha', e.target.value);
    });

    document.getElementById('testPanelToggle').addEventListener('change', (e) => {
        document.getElementById('manualTestArea').style.display = e.target.checked ? 'flex' : 'none';
    });

    // =====================================

    const statusText = document.getElementById('status-text');
    const statusIndicator = document.getElementById('status-indicator');

    function atualizarStatus(msg, state = 'normal') { 
        statusText.innerText = msg; 
        statusIndicator.className = 'status-dot'; // reseta classes
        if(state === 'connected') statusIndicator.classList.add('connected');
        if(state === 'disconnected') statusIndicator.classList.add('disconnected');
    }

    function processarValor(valorRaw) {
        if (!valorRaw) return;
        let valor = parseFloat(valorRaw);
        if (isNaN(valor)) return;
        
        // Animação de entrada do valor
        const valorDisplay = document.getElementById('valor-sensor');
        valorDisplay.innerText = valor;
        valorDisplay.style.transform = 'scale(1.1)';
        setTimeout(() => valorDisplay.style.transform = 'scale(1)', 100);

        if (currentLat === 0 || currentLng === 0) return;

        const now = Date.now();
        if (now - lastPointTime < POINT_INTERVAL) return;
        lastPointTime = now;

        const novoPontoLatLng = L.latLng(currentLat, currentLng);
        const localJaMapeado = pontosRegistrados.some(pontoSalvo => novoPontoLatLng.distanceTo(pontoSalvo) < RAIO_MINIMO_METROS);

        if (localJaMapeado) return;
        pontosRegistrados.push(novoPontoLatLng);

        let intensidade = 0.6;
        if (valor < 200) { ptsBlue.push([currentLat, currentLng, intensidade]); layerBlue.setLatLngs(ptsBlue); }
        else if (valor <= 800) { ptsYellow.push([currentLat, currentLng, intensidade]); layerYellow.setLatLngs(ptsYellow); }
        else { ptsRed.push([currentLat, currentLng, intensidade]); layerRed.setLatLngs(ptsRed); }
    }

    document.getElementById('btnAddManual').addEventListener('click', () => {
        processarValor(document.getElementById('manualInput').value);
    });

    // --- CAPTURA DE LOCALIZAÇÃO ---
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(position => {
            currentLat = position.coords.latitude;
            currentLng = position.coords.longitude;
            const newLatLng = L.latLng(currentLat, currentLng);

            if (userCircle) {
                userCircle.setLatLng(newLatLng);
            } else {
                // Bolinha azul estilo nativo Apple Maps
                userCircle = L.circleMarker(newLatLng, { 
                    radius: 8, color: 'white', weight: 3, 
                    fillColor: '#007aff', fillOpacity: 1 
                });
                locationGroup.addLayer(userCircle);
                map.setView(newLatLng, 17);
            }

            if (userPathCoords.length === 0) {
                userPathCoords.push(newLatLng);
                userPathLine.addLatLng(newLatLng);
            } else {
                const lastLatLng = userPathCoords[userPathCoords.length - 1];
                if (newLatLng.distanceTo(lastLatLng) > 2) {
                    userPathCoords.push(newLatLng);
                    userPathLine.addLatLng(newLatLng);
                }
            }

        }, null, { enableHighAccuracy: true });
    }

    document.getElementById('btnCenter').addEventListener('click', () => { if (currentLat !== 0) map.setView([currentLat, currentLng], 18); });

    async function connectBLE() {
        if (isConnecting) return;
        isConnecting = true;
        const btn = document.getElementById('btnConnect');
        btn.innerHTML = '<i data-lucide="loader-2" class="lucide-spin"></i> Conectando...';
        lucide.createIcons();

        try {
            atualizarStatus("Buscando Dispositivo...", "normal");
            bluetoothDevice = await navigator.bluetooth.requestDevice({ filters: [{ name: 'ESP32_Heatmap' }], optionalServices: [SERVICE_UUID] });
            bluetoothDevice.addEventListener('gattserverdisconnected', handleDisconnect);
            const server = await bluetoothDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            characteristic = await service.getCharacteristic(CHAR_UUID);
            await characteristic.startNotifications();
            characteristic.addEventListener('characteristicvaluechanged', (e) => {
                const value = new TextDecoder().decode(e.target.value);
                processarValor(value.trim());
            });
            atualizarStatus("Conectado", "connected");
            btn.innerHTML = '<i data-lucide="bluetooth-connected"></i> Conectado';
            btn.style.background = 'var(--success)';
            lucide.createIcons();
        } catch (error) { 
            atualizarStatus("Falha na Conexão", "disconnected"); 
            btn.innerHTML = '<i data-lucide="bluetooth"></i> Tentar Novamente';
            btn.style.background = 'var(--accent)';
            lucide.createIcons();
        }
        finally { isConnecting = false; }
    }

    function handleDisconnect() {
        atualizarStatus("Desconectado", "disconnected");
        const btn = document.getElementById('btnConnect');
        btn.innerHTML = '<i data-lucide="bluetooth"></i> Reconectar';
        btn.style.background = 'var(--danger)';
        lucide.createIcons();
        setTimeout(() => { if (bluetoothDevice) connectBLE(); }, 2000);
    }

    document.getElementById('btnShutdown').addEventListener('click', async () => {
        if (!characteristic) { alert("Conecte ao ESP32 primeiro!"); return; }
        if (confirm("Deseja desligar o Bingo? (Será necessário apertar Reset no aparelho)")) {
            const encoder = new TextEncoder();
            await characteristic.writeValue(encoder.encode("SHUTDOWN"));
            atualizarStatus("Desligando...", "disconnected");
            toggleSheet(); // Fecha o menu ao enviar comando
        }
    });

    document.getElementById('btnConnect').addEventListener('click', connectBLE);
</script>

<style>
    /* Keyframe para o ícone de loading girar */
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .lucide-spin { animation: spin 2s linear infinite; }
</style>
</body>
</html>
